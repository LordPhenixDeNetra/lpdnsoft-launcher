[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    # zbus_names, zvariant, zvariant_derive : fusionnés dans zbus 6, qui les remplace.
    # Encore tirés par zbus 5 (accessibilité d'eframe) ; pas de faille, aucune version
    # corrigée. À retirer quand eframe passera à zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant fusionné dans zbus 6 ; zbus 5 via eframe" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names fusionné dans zbus 6 ; zbus 5 via eframe" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive fusionné dans zbus 6 ; zbus 5 via eframe" },
]

[licenses]
version = 2
# Liste commune aux dépôts LPDNSoft.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    # Polices par défaut d'egui (epaint_default_fonts) : OFL et licence Ubuntu, permissives.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Autorités de certification de Mozilla (webpki-root-certs, via rustls) : licence de
    # données permissive, comme webpki-roots.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# option-ext (via directories → dirs-sys, tiré par lpdnsoft-settings) : MPL-2.0, copyleft
# limité au fichier, non modifié ici.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]
