name: Release

# Publication automatique : dès qu'une version du workspace arrive sur `main` et qu'aucune
# release ne porte déjà ce numéro, les cinq paquets sont construits, empreints et publiés,
# avec des notes de version générées par GitHub à partir des pull requests fusionnées.
#
# Les noms d'actifs sont un contrat : le launcher les cherche avec le motif d'apps.json
# (`lpdnsoft-launcher-{version}-{os}-{arch}.{ext}`). Le test
# `apps/launcher/tests/release_assets.rs` vérifie que ce fichier les produit tous.

on:
  push:
    branches: [main]
  # Relance une publication qui a échoué (même version déjà présente dans Cargo.toml), sans
  # avoir à pousser un commit vide.
  workflow_dispatch:

permissions:
  contents: write

# Deux publications ne doivent jamais se chevaucher.
concurrency:
  group: release
  cancel-in-progress: false

# Le launcher dépend du dépôt frère par `path = "../lpdnsoft-libs/..."` : les deux dépôts
# sont donc clonés côte à côte, et tout s'exécute depuis `lpdnsoft-launcher`.
defaults:
  run:
    working-directory: lpdnsoft-launcher

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lpdnsoft-launcher
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version est déjà publiée : rien à faire."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version sera publiée."
          fi

  linux:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: lpdnsoft-launcher
      # Dépôt frère : dépendance par chemin, hors du dépôt.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lpdnsoft-launcher
      - name: Outils de paquet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Compilation
        run: cargo build --release -p lpdnsoft-launcher
      - name: Paquets
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          cargo deb -p lpdnsoft-launcher --no-build --no-strip
          cargo generate-rpm --manifest-path apps/launcher/Cargo.toml
          mv target/debian/*.deb "lpdnsoft-launcher-$version-linux-x86_64.deb"
          mv target/generate-rpm/*.rpm "lpdnsoft-launcher-$version-linux-x86_64.rpm"
          ls -l lpdnsoft-launcher-*.deb lpdnsoft-launcher-*.rpm
      - name: Essai du .deb
        run: |
          set -euo pipefail
          sudo apt-get install -y ./lpdnsoft-launcher-*-linux-x86_64.deb
          dpkg-query -W -f='${Version}\n' lpdnsoft-launcher
          test -x /usr/bin/lpdnsoft-launcher
          sudo dpkg --purge lpdnsoft-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            lpdnsoft-launcher/lpdnsoft-launcher-*-linux-x86_64.deb
            lpdnsoft-launcher/lpdnsoft-launcher-*-linux-x86_64.rpm

  windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-2025
    steps:
      - name: Chemins longs
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: lpdnsoft-launcher
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lpdnsoft-launcher
      - name: WiX
        # WiX 5 s'installe comme outil dotnet ; `choco install wixtoolset` poserait WiX 3,
        # qui ne connaît pas `wix build` (même choix qu'aNkou, ADR 0011).
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compilation
        run: cargo build --release -p lpdnsoft-launcher
      - name: MSI
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          wix build packaging/windows/launcher.wxs -arch x64 `
            -d Version=$version -d BinDir=target\release `
            -o "lpdnsoft-launcher-$version-windows-x86_64.msi"
          Get-ChildItem *.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lpdnsoft-launcher/lpdnsoft-launcher-*-windows-x86_64.msi

  macos:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lpdnsoft-launcher
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lpdnsoft-libs
          path: lpdnsoft-libs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lpdnsoft-launcher
      - name: Compilation
        run: |
          rustup target add ${{ matrix.arch }}-apple-darwin
          cargo build --release -p lpdnsoft-launcher --target ${{ matrix.arch }}-apple-darwin
      - name: Paquet
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          bash packaging/macos/build-pkg.sh "$version" "${{ matrix.arch }}" \
            "target/${{ matrix.arch }}-apple-darwin/release/lpdnsoft-launcher" \
            "lpdnsoft-launcher-$version-macos-${{ matrix.arch }}.pkg"
          ls -l *.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: lpdnsoft-launcher/lpdnsoft-launcher-*-macos-${{ matrix.arch }}.pkg

  publish:
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-24.04
    # Ce job ne compile pas : il n'a pas de dépôt cloné, donc il travaille à la racine.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Empreintes
        run: |
          set -euo pipefail
          cd dist
          find . -type f ! -name SHA256SUMS -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # `--generate-notes` fait écrire les notes par GitHub à partir des pull requests
          # fusionnées depuis la release précédente : elles restent vraies sans que personne
          # ne les rédige. `--target main` crée le tag au bon endroit, puisque plus aucun tag
          # n'est poussé à la main.
          gh release create "v$version" dist/* \
            --repo "${{ github.repository }}" \
            --target main \
            --title "LPDNSoft Launcher $version" \
            --generate-notes
